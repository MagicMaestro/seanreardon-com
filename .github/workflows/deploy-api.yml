name: Deploy AI search API

# Deploys the standalone Node.js semantic-search backend (api-server/) that
# serves /api/search — the site's flagship live AI feature (the nozzle search
# modal). SPR-0090 (cPanel decommission, Buffalo P6) re-homed it off cPanel.
#
# DEPLOY TARGET (SPR-0090): rsync the app to /srv/seanreardon.com/portfolio-search/
# as the non-cPanel `deploy` user, then restart a long-running service. This
# replaces the prior cPanel Application Manager / Phusion Passenger topology
# (app at /home/sreardon/apps/portfolio-search/, restart via touch tmp/restart.txt),
# which went away when Buffalo decommissioned cPanel and cut Apache over to Caddy.
#
# HOSTING (Buffalo's side, per redesign→optimizer handoff brief 014): the app
# runs as a long-running service (systemd unit, modeled on the MEP API) started
# with `node app.js` from the app root, bound to 127.0.0.1:3002 (3001 was
# taken by Uptime Kuma — confirmed in brief 014 hand-back). Caddy
# reverse_proxies /api/* on seanreardon.com to it — so the public path stays
# https://seanreardon.com/api/search and the static frontend's relative
# fetch('/api/search') needs NO change. The service's env + model cache come
# from the systemd unit (see "Server-side prerequisites" below).
#
# Triggers on push to main when ANY input to the runtime or the search corpus
# changes. The static-site deploy (deploy-staging.yml) runs in parallel for the
# same push when relevant — independent concerns (the service vs the web root).
#
# DEPLOY STRATEGY — pre-build-and-rsync (brief 012's Option 1, shipped SPR-0061):
# The runner does a full `npm ci`, builds the search index, prunes devDeps in
# place, then rsyncs the ENTIRE app dir INCLUDING node_modules/ to the server.
# Server-side `npm ci` is NOT run. (Originally adopted to sidestep the brief 011
# server-side npm-ci SIGKILL under cPanel jailshell; retained off-cPanel because
# building on the runner is simply faster and more reproducible.) rsync `-a`
# preserves exec bits, so tsx's esbuild binary keeps its +x across the hop —
# the brief 010/011 EACCES failure mode. Buffalo verifies esbuild is executable
# after the first /srv deploy.
#
# Server-side prerequisites (one-time, established by handoff brief 014):
#   - Node 22 available to the systemd unit (Buffalo's choice of path; no longer
#     /opt/cpanel/ea-nodejs22 since cPanel is gone)
#   - `portfolio-search` systemd service installed (start: `node app.js` in
#     /srv/seanreardon.com/portfolio-search/, bind 127.0.0.1:3002)
#   - Caddy reverse_proxy route: /api/search* on seanreardon.com → 127.0.0.1:3002
#   - .env (or systemd Environment=) supplying SEARCH_INDEX_PATH, API_LOG_DIR,
#     PORT, HOST — NO secrets (fully self-hosted MiniLM; ANTHROPIC_API_KEY only
#     enters at v1.1 chat)
#   - a writable model-cache dir (HF_HOME) for the ~80 MB MiniLM download, or a
#     one-time pre-warm run
#   - logs/, public/ directories exist (tmp/ no longer needed — that held the
#     Passenger restart sentinel)
#   - `deploy` can restart the service (sudoers rule or a user-level unit) —
#     exact command confirmed by Buffalo in the brief 014 hand-back
#
# Glibc compatibility (per optimizer brief 012 Task 2 hand-back, 2026-05-23;
# still current — only cPanel was removed, not the OS):
#   - Server: AlmaLinux 8.10, glibc 2.28, x86_64
#   - Runtime native deps and their highest GLIBC requirement:
#       @img/sharp-linux-x64        2.17
#       onnxruntime-node (linux64)  2.14
#       @rollup/rollup-linux-x64-gnu 2.4
#   - All ship prebuilts via the manylinux2014 baseline — none compile from
#     source at install time. The runner's glibc therefore doesn't affect
#     what gets shipped; runner pin is for stability (avoiding `ubuntu-latest`
#     image rotation), not compatibility.
#
# After this workflow's rsync replaces the app dir contents and the service
# restarts, the cold-start downloads the MiniLM model (~80 MB) on first request
# unless the cache is pre-warmed; expect ~3–5s first-response latency, then
# ~50 ms warm.

on:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'api-server/**'
      - 'src/lib/search/**'
      - 'src/content/writing/**'
      - 'src/pages/about-me.astro'
      - 'src/pages/privacy/index.astro'
      - 'src/pages/lab/**'
      - 'scripts/build-search-index.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'deploy/api-files.txt'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

env:
  # Match the staging workflow's Node 24 opt-in for actions JS runtimes.
  # The PRODUCTION app runs Node 22 via Buffalo's systemd unit (SPR-0090; no
  # longer cPanel's ea-nodejs22) — this var only affects GitHub Actions' own
  # JS-action runtime, not our app's runtime.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

  # NOTE (SPR-0090): this deploy ships a runner-built node_modules and does NOT
  # run a server-side install, so no remote Node path is referenced here. If a
  # future SSH-driven server-side step is ever added, point it at whatever node
  # the systemd unit uses (Buffalo's choice), not the retired
  # /opt/cpanel/ea-nodejs22 path.

jobs:
  deploy:
    # Pinned to ubuntu-22.04 (glibc 2.35) per brief 012 Task 2's recommendation.
    # Server is glibc 2.28; the relevant native prebuilts target glibc 2.17
    # (manylinux2014), so the runner's glibc baseline isn't load-bearing — but
    # avoid `ubuntu-latest` because GitHub rotates the default image without
    # notice, and we want stable, reproducible deploys.
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install dependencies (CI build env)
        # Full install (incl. devDeps) so we can run the indexer next, which
        # needs build-time tools (tsx, typescript). The "Prune dev dependencies"
        # step below drops devDeps in-place before the rsync, so what ships
        # to the server is the production-only subset.
        run: npm ci

      - name: Rebuild search index
        # Picks up any content changes in writing/ + the indexable static pages.
        # Incremental cache (SHA256 of doc text) means unchanged entries are
        # reused — fast. Output: public/search-index.json — included in the
        # rsync manifest below.
        run: npm run build:search-index

      - name: Prune dev dependencies
        # `npm prune --omit=dev` walks node_modules and removes packages that
        # are in devDependencies in package.json (typescript, wrangler, @types/*,
        # @cloudflare/workers-types, etc.). The result matches what
        # `npm ci --omit=dev` would have produced — but in-place, without
        # re-downloading from the registry.
        #
        # SPR-0061 (brief 012's Option 1 pivot): the resulting node_modules
        # is what we ship to the server via rsync. Server no longer runs its
        # own install.
        run: npm prune --omit=dev

      - name: Configure SSH
        # Uses ssh.seanreardon.com (DNS-only origin record) per the
        # deploy-staging workflow's documented rationale — port 7822 doesn't
        # traverse Cloudflare's proxy on the apex.
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 7822 -H ssh.seanreardon.com >> ~/.ssh/known_hosts 2>/dev/null

      - name: Rsync to portfolio-search service dir
        # Selective sync via deploy/api-files.txt manifest. SPR-0061 added
        # `node_modules/` to the manifest — the runner-built, devDeps-pruned
        # node_modules ships directly to the server, replacing the old server-
        # side `npm ci --omit=dev` step entirely.
        #
        # SPR-0090: target moved to /srv/seanreardon.com/portfolio-search/
        # (deploy user) from the retired cPanel app slot.
        #
        # Notably absent from the manifest (server-managed, never touched by the deploy):
        #   - .env / systemd Environment= (env vars: SEARCH_INDEX_PATH,
        #     API_LOG_DIR, PORT, HOST — no secrets)
        #   - logs/ (app writes its query log here)
        # No --delete: cruft is tolerated; intentional server state (.env + logs/)
        # is never at risk. (tmp/ is no longer relevant — it held the Passenger
        # restart sentinel; the systemd restart below replaces that mechanism.)
        #
        # The node_modules transfer is ~945 MB on cold deploy (per brief 011's
        # measurement). Rsync's incremental delta-transfer + compression means
        # subsequent deploys typically transfer only changed packages (a few MB).
        run: |
          rsync -avz \
            --files-from=deploy/api-files.txt \
            --exclude='desktop.ini' \
            --exclude='.DS_Store' \
            --exclude='Thumbs.db' \
            -e "ssh -i ~/.ssh/deploy_key -p 7822" \
            ./ deploy@ssh.seanreardon.com:/srv/seanreardon.com/portfolio-search/

      - name: Restart the portfolio-search service
        # SPR-0090: replaces Passenger's `touch tmp/restart.txt` sentinel. The
        # app now runs as a long-running systemd service; restart it to pick up
        # the freshly-rsynced code + index.
        #
        # Confirmed in brief 014 hand-back: a scoped /etc/sudoers.d/portfolio-search
        # lets `deploy` run only start/stop/restart/status on this one unit
        # (NOPASSWD, for non-interactive CI), so `sudo systemctl restart
        # portfolio-search` is the correct command.
        #
        # `sudo -n` (non-interactive) makes this fail fast with a clear error if
        # the sudoers rule is ever missing/changed, instead of hanging on a
        # password prompt in this TTY-less SSH session.
        run: |
          ssh -i ~/.ssh/deploy_key -p 7822 deploy@ssh.seanreardon.com \
            "sudo -n systemctl restart portfolio-search"

      - name: Verify deploy
        # Give the service a beat to restart + load the MiniLM model. First-deploy
        # cold-start is ~3–5s (model download unless pre-warmed); subsequent
        # restarts after the cache is warm are ~1s. Sleep generously so the
        # health check isn't a flake. Hits the unchanged public path — Caddy
        # reverse-proxies /api/* on seanreardon.com to the service (SPR-0090).
        run: |
          sleep 10
          echo "=== Health check ==="
          curl -sS https://seanreardon.com/api/search/health || echo "health endpoint not yet responding"
          echo ""
          echo "=== Sample query ==="
          curl -sS -X POST \
            -H "Content-Type: application/json" \
            -d '{"q":"AI integration"}' \
            https://seanreardon.com/api/search \
            | head -c 600 \
            || echo "search endpoint not yet responding"
          echo ""
