name: Deploy AI search API

# Deploys the standalone Node.js semantic-search backend (api-server/) to the
# cPanel Application Manager slot at /home/sreardon/apps/portfolio-search/.
#
# Triggers on push to main when ANY input to the runtime or the search corpus
# changes. The static-site deploy (deploy-staging.yml) runs in parallel for
# the same push when relevant — they're independent concerns (apps/portfolio-search/
# vs public_html/).
#
# DEPLOY STRATEGY — pre-build-and-rsync (brief 012's Option 1, shipped SPR-0061):
# The runner does a full `npm ci`, builds the search index, prunes devDeps in
# place, then rsyncs the ENTIRE app dir INCLUDING node_modules/ to the server.
# Server-side `npm ci` is NOT run.
#
# This sidesteps the unsolved npm-ci-killed-at-~12s mystery from brief 011 —
# the SIGKILL fires server-side under the GHA SSH session for reasons the
# optimizer ruled out (no OOM, no LVE, no ulimit, no cgroup, no quota, etc.).
# Brief 011's `/var/log/secure` analysis pointed at an SSH2_DISCONNECT_BY_-
# APPLICATION from the runner side; mechanism unknown. Rather than fight an
# unreproducible intermittent kill, the deploy moves the install to the runner
# (which has ample RAM and no jailshell), and ships the resolved node_modules
# as deploy state.
#
# Server-side prerequisites (one-time, established by optimizer-handoff brief 009):
#   - Node 22.22.2+ installed at /opt/cpanel/ea-nodejs22/bin/node
#   - `portfolio-search` app registered via UAPI; vhost includes in place
#   - PassengerMaxInstancesPerApp 1 enforced server-wide (single worker)
#   - .env file at /home/sreardon/apps/portfolio-search/.env (env vars; cPanel's
#     UAPI envvar delivery doesn't reach OSS-Passenger Node children)
#   - logs/, tmp/, public/ directories exist
#
# Glibc compatibility (per optimizer brief 012 Task 2 hand-back, 2026-05-23):
#   - Server: AlmaLinux 8.10, glibc 2.28, x86_64
#   - Runtime native deps and their highest GLIBC requirement:
#       @img/sharp-linux-x64        2.17
#       onnxruntime-node (linux64)  2.14
#       @rollup/rollup-linux-x64-gnu 2.4
#   - All ship prebuilts via the manylinux2014 baseline — none compile from
#     source at install time. The runner's glibc therefore doesn't affect
#     what gets shipped; runner pin is for stability (avoiding `ubuntu-latest`
#     image rotation), not compatibility.
#
# After this workflow's rsync replaces the app dir contents and Passenger
# restarts (via touch tmp/restart.txt), the cold-start downloads the MiniLM
# model (~80 MB) on first request; expect ~3–5s first-response latency, then
# ~50 ms warm.

on:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'api-server/**'
      - 'src/lib/search/**'
      - 'src/content/writing/**'
      - 'src/pages/about-me.astro'
      - 'src/pages/privacy/index.astro'
      - 'src/pages/lab/**'
      - 'scripts/build-search-index.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'deploy/api-files.txt'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

env:
  # Match the staging workflow's Node 24 opt-in for actions JS runtimes.
  # The PRODUCTION app runs Node 22 via cPanel's ea-nodejs22 — this var only
  # affects GitHub Actions' own JS-action runtime, not our app's runtime.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

  # NOTE: REMOTE_NODE_BIN (/opt/cpanel/ea-nodejs22/bin) was used by the old
  # server-side `npm ci --omit=dev` step. SPR-0061 dropped that step, so the
  # var is no longer referenced. If a future SSH-driven server-side install
  # step is ever added, use `bash -lc 'export PATH=/opt/cpanel/ea-nodejs22/bin:
  # $PATH; ...'` per the brief 012 Task 1 hand-back's PATH-gotcha note —
  # `bash -c` will succeed for top-level npm but fail with exit 127 the moment
  # any package has an install lifecycle script that shells out to `node`.

jobs:
  deploy:
    # Pinned to ubuntu-22.04 (glibc 2.35) per brief 012 Task 2's recommendation.
    # Server is glibc 2.28; the relevant native prebuilts target glibc 2.17
    # (manylinux2014), so the runner's glibc baseline isn't load-bearing — but
    # avoid `ubuntu-latest` because GitHub rotates the default image without
    # notice, and we want stable, reproducible deploys.
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install dependencies (CI build env)
        # Full install (incl. devDeps) so we can run the indexer next, which
        # needs build-time tools (tsx, typescript). The "Prune dev dependencies"
        # step below drops devDeps in-place before the rsync, so what ships
        # to the server is the production-only subset.
        run: npm ci

      - name: Rebuild search index
        # Picks up any content changes in writing/ + the indexable static pages.
        # Incremental cache (SHA256 of doc text) means unchanged entries are
        # reused — fast. Output: public/search-index.json — included in the
        # rsync manifest below.
        run: npm run build:search-index

      - name: Prune dev dependencies
        # `npm prune --omit=dev` walks node_modules and removes packages that
        # are in devDependencies in package.json (typescript, wrangler, @types/*,
        # @cloudflare/workers-types, etc.). The result matches what
        # `npm ci --omit=dev` would have produced — but in-place, without
        # re-downloading from the registry.
        #
        # SPR-0061 (brief 012's Option 1 pivot): the resulting node_modules
        # is what we ship to the server via rsync. Server no longer runs its
        # own install.
        run: npm prune --omit=dev

      - name: Configure SSH
        # Uses ssh.seanreardon.com (DNS-only origin record) per the
        # deploy-staging workflow's documented rationale — port 7822 doesn't
        # traverse Cloudflare's proxy on the apex.
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 7822 -H ssh.seanreardon.com >> ~/.ssh/known_hosts 2>/dev/null

      - name: Rsync to portfolio-search app slot
        # Selective sync via deploy/api-files.txt manifest. SPR-0061 added
        # `node_modules/` to the manifest — the runner-built, devDeps-pruned
        # node_modules ships directly to the server, replacing the old server-
        # side `npm ci --omit=dev` step entirely.
        #
        # Notably absent from the manifest (server-managed, never touched by the deploy):
        #   - .env (env vars, established by optimizer brief 009)
        #   - logs/ (app writes its query log here)
        #   - tmp/ (Passenger restart sentinel lives here)
        # No --delete: cruft is tolerated; intentional state on the server
        # (the three dirs above + .env) is never at risk.
        #
        # The node_modules transfer is ~945 MB on cold deploy (per brief 011's
        # measurement). Rsync's incremental delta-transfer + compression means
        # subsequent deploys typically transfer only changed packages (a few
        # MB). Cold-deploy time impact: ~1-2 min slower than the prior strategy,
        # but with zero residual SIGKILL risk.
        run: |
          rsync -avz \
            --files-from=deploy/api-files.txt \
            --exclude='desktop.ini' \
            --exclude='.DS_Store' \
            --exclude='Thumbs.db' \
            -e "ssh -i ~/.ssh/deploy_key -p 7822" \
            ./ sreardon@ssh.seanreardon.com:/home/sreardon/apps/portfolio-search/

      - name: Restart Passenger worker
        # touch tmp/restart.txt is Passenger's documented restart sentinel.
        # On next request, Passenger sees the new mtime and spawns a fresh
        # worker with the updated code. No Apache reload needed.
        run: |
          ssh -i ~/.ssh/deploy_key -p 7822 sreardon@ssh.seanreardon.com \
            "touch /home/sreardon/apps/portfolio-search/tmp/restart.txt"

      - name: Verify deploy
        # Give Passenger a beat to spawn the worker + load the MiniLM model.
        # First-deploy cold-start is ~3–5s (model download to ~/.cache/transformers/);
        # subsequent restarts after the cache is warm are ~1s. Sleep generously
        # so the health check isn't a flake.
        run: |
          sleep 10
          echo "=== Health check ==="
          curl -sS https://seanreardon.com/api/search/health || echo "health endpoint not yet responding"
          echo ""
          echo "=== Sample query ==="
          curl -sS -X POST \
            -H "Content-Type: application/json" \
            -d '{"q":"AI integration"}' \
            https://seanreardon.com/api/search \
            | head -c 600 \
            || echo "search endpoint not yet responding"
          echo ""
